<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Kevin Ortega Diaz</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        h2 {
            position: absolute;
            top: 20px;
            font-size: 25px;
            letter-spacing: 2px;
            color: #00ffff;
        }

        h1 {
            font-size: 60px;
            text-transform: uppercase;
            position: relative;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            }
            to {
                text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            }
        }
    </style>
</head>

<body>

<h2>Ingeniería en TI</h2>

<h3> Ya vamos a acabar la Ingenieríaaaaa </h3>

<h1>Kevin Ortega Diaz</h1>

</body>
</html>
